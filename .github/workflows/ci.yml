name: CI

# The publishing workflows run on tags and on a schedule, so this is what covers
# ordinary pushes. A --locked build here surfaces lockfile drift at the commit
# that introduces it: Cargo.lock had been missing 9 packages, including
# clap_derive, which src/main.rs requires via #[derive(Parser)].

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per way this build can differ:
        #   ubuntu  - the cheap gate for lockfile and compile breakage, and the
        #             only target where OpenSSL is vendored.
        #   windows - MSVC and the CMake/Ninja assumptions, plus the 4 GiB
        #             static-library limit that decides debug vs release.
        #             OpenSSL is vendored here too: lbug 0.20.4 hard-links it.
        #   macos   - Clang and libc++ rather than GCC or MSVC, and the other
        #             side of the OpenSSL target gate (Security.framework).
        #             macos-15 is arm64, a standard runner, free on a public
        #             repository. x64 macs were dropped 2026-09: ort rc.13
        #             ships no prebuilt ONNX Runtime for x86_64-apple-darwin,
        #             and every fastembed >= 5 pins that ort.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      # lbug (LadybugDB) compiles a C++ core with CMake. Any 3.15+ works,
      # including the CMake 4 the macOS image ships -- verified by building the
      # whole tree against 4.3.1 with no policy override.
      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      # The vendored OpenSSL build (needed by lbug's link directives) requires
      # a Perl with Windows module support: the Git-bundled perl that wins PATH
      # exits 2 during Configure. Strawberry Perl is preinstalled on the image;
      # point openssl-src at it explicitly. NASM is also preinstalled but not
      # always on PATH.
      - name: Configure vendored OpenSSL build (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/neurostrata-mcp.exe
          else
            BIN=target/release/neurostrata-mcp
          fi
          "$BIN" --version

      # The binary reports CARGO_PKG_VERSION. If someone reintroduces a
      # hardcoded string in the clap attribute, this catches it.
      - name: Version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/neurostrata-mcp.exe
          else
            BIN=target/release/neurostrata-mcp
          fi
          expected="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          reported="$("$BIN" --version | tr -d '\r' | awk '{print $NF}')"
          echo "Cargo.toml=$expected  binary=$reported"
          if [ "$expected" != "$reported" ]; then
            echo "::error::Binary reports '$reported' but Cargo.toml says '$expected'."
            exit 1
          fi

  # The build job proves compilation; this proves behavior. Single test
  # thread because the suite's per-test temp databases exhaust the mmap
  # budget when run in parallel (intermittent "Mmap for size ... failed").
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      - name: Test
        shell: bash
        run: cargo test --locked -- --test-threads=1

  # Quality gates (J16). These four jobs are REPORT-ONLY: each records the
  # pre-existing backlog in .github/quality-baseline.md and reports against
  # it; none of them blocks a merge. The backlog itself is Task 15b's to
  # burn down, upstream, module by module -- a tree-wide cleanup sweep is
  # never landed from a fork. Promotion of a job from report-only to
  # required happens only when its baseline count reaches zero.
  fmt:
    name: fmt (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The tree uses no toolchain action (the images provide Rust), so the
      # component is added the same way here.
      - name: Add rustfmt component
        shell: bash
        run: rustup component add rustfmt

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

  clippy:
    name: clippy (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Add clippy component
        shell: bash
        run: rustup component add clippy

      # Clippy compiles the dependency graph, so lbug's build script runs
      # and needs CMake, exactly as in the build/test jobs.
      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      - name: cargo clippy
        shell: bash
        run: cargo clippy --locked -- -D warnings

  audit:
    name: audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The maintained RustSec action, so no audit tooling is added to the
      # repository's own dependency tree.
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: deny (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The maintained cargo-deny action, for the same reason as audit.
      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
