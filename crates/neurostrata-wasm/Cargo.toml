[package]
name = "neurostrata-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
# `src/graph_read/related.rs` is included by path (see src/lib.rs) and its
# cfg(test) module captures log output via `tracing_subscriber`; the main
# crate gets the crate from its own dependency set, this crate needs it
# declared for its lib-test build to compile.
tracing-subscriber = "0.3"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
